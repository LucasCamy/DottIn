name: Deploy DottIn

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-api:
    name: Build & Push API Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push DottIn API
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/src/DottIn.Presentation.WebApi/Dockerfile
          push: true
          tags: |
            ghcr.io/lucascamy/dottin-api:latest
            ghcr.io/lucascamy/dottin-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-admin:
    name: Build & Push Admin UI Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push DottIn Admin UI
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/clients/DottIn.Admin/Dockerfile
          push: true
          tags: |
            ghcr.io/lucascamy/dottin-admin:latest
            ghcr.io/lucascamy/dottin-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
