name: Deploy DottIn

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-api:
    name: Build & Push API Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push DottIn API
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/src/DottIn.Presentation.WebApi/Dockerfile
          push: true
          tags: |
            ghcr.io/lucascamy/dottin-api:latest
            ghcr.io/lucascamy/dottin-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-admin:
    name: Build & Push Admin UI Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push DottIn Admin UI
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/clients/DottIn.Admin/Dockerfile
          push: true
          tags: |
            ghcr.io/lucascamy/dottin-admin:latest
            ghcr.io/lucascamy/dottin-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-k8s:
    name: Deploy to Kubernetes via Tailscale
    needs:
      - build-and-push-api
      - build-and-push-admin
    runs-on: ubuntu-latest
    steps:
      - name: Conectar à rede Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configurar Kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Atualizar Deployment no Kubernetes
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          kubectl set image deployment/dottin-api -n dottin api=ghcr.io/${REPO_OWNER}/dottin-api:${{ github.sha }}
          kubectl set image deployment/dottin-admin -n dottin admin=ghcr.io/${REPO_OWNER}/dottin-admin:${{ github.sha }}
          kubectl rollout status deployment/dottin-api -n dottin --timeout=120s
          kubectl rollout status deployment/dottin-admin -n dottin --timeout=120s
